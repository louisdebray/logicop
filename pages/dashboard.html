<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes outils — Logicop</title>
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=2">
<style>
  .company-label { color: var(--bm-red); font-weight: 700; }
  #emailLabel { color: var(--text-dim); }
  .tools-count { margin: 0 0 14px; font: 700 0.74rem/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  #emptyMsg { padding: 48px 24px; background: #fff; text-align: center; font-size: 0.95rem; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="Logicop, accueil"><img class="brand-mark" src="../assets/img/bm-cube.png" alt=""><span class="brand-text"><span class="brand-name">Logicop</span><span class="by-line">Beauce Matériel</span></span></a>
  <nav>
    <a href="../index.html">Accueil</a>
    <span id="navAccount"></span>
  </nav>
</header>

<main id="main">
  <div class="hero">
    <h1>Mes outils</h1>
    <p><span id="companyLabel" class="company-label"></span><span id="emailLabel"></span></p>
  </div>

  <p class="tools-count" id="toolsCount" hidden></p>
  <div class="grid" id="toolsGrid"></div>
  <p class="hint" id="emptyMsg" hidden>
    Aucun outil ne vous a encore été attribué. Demandez à un gestionnaire de vous donner les accès.
  </p>

  <footer class="site-footer"><span>Logicop</span><span>Beauce Matériel</span></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-config.js?v=2"></script>
<script src="../assets/js/icons.js?v=2"></script>
<script>
  (async function init() {
    const session = await requireSession('login.html');
    if (!session) return;
    const profile = await loadCurrentProfile();
    if (!profile) { window.location.href = 'login.html'; return; }
    if (profile.is_admin) { window.location.href = 'admin.html'; return; }

    renderNavAccount('navAccount', '');

    if (!profile.company_id) {
      document.getElementById('emailLabel').textContent = profile.full_name || profile.email;
      document.getElementById('emptyMsg').hidden = false;
      document.getElementById('emptyMsg').textContent =
        "Votre compte n'est pas encore rattaché à une entreprise. Contactez Logicop pour activer votre accès.";
      return;
    }

    const { data: company } = await supabaseClient.from('companies').select('name').eq('id', profile.company_id).single();
    if (company) {
      document.getElementById('companyLabel').textContent = company.name;
      document.getElementById('emailLabel').textContent = ' — ' + (profile.full_name || profile.email);
    } else {
      document.getElementById('emailLabel').textContent = profile.full_name || profile.email;
    }

    const { data: tools, error } = await supabaseClient.from('tools').select('*').order('name');
    if (error) { console.error(error); return; }

    const grid = document.getElementById('toolsGrid');
    document.getElementById('emptyMsg').hidden = (tools || []).length > 0;
    const countEl = document.getElementById('toolsCount');
    countEl.textContent = (tools || []).length + ' outil' + ((tools || []).length > 1 ? 's' : '') + ' · glissez une carte pour la déplacer, ★ pour la garder en tête';
    countEl.hidden = !(tools || []).length;

    const BRAND_LOGOS = [
      { match: /hangcha/i, src: '../assets/img/logo.hangcha.png' },
      { match: /mitsubishi/i, src: '../assets/img/logo.mitsubishi.png' },
      { match: /cesab/i, src: '../assets/img/logo.cesab.png' },
      { match: /\bep\b/i, src: '../assets/img/logo.ep.png' },
      { match: /byd/i, src: '../assets/img/logo.byd.png' },
    ];
    const ICON_BY_TYPE = {
      capacite_residuelle: 'forklift', transport: 'truck', documents: 'documents', qrcode_blg: 'qrcode',
      coefficient: 'chart', etiquettes_blg: 'tag', rapport_controle: 'clipboard',
      catalogue_produits: 'catalogue', bibliotheque_prompts: 'prompt',
    };
    function toolIconHtml(tool) {
      const appType = (tool.config || {}).appType;
      if (ICON_BY_TYPE[appType]) return `<div class="icon">${logicopIcon(ICON_BY_TYPE[appType])}</div>`;
      const brand = BRAND_LOGOS.find((b) => b.match.test(tool.name) || b.match.test(tool.description || ''));
      if (brand) return `<div class="icon brand-icon"><img src="${brand.src}" alt=""></div>`;
      return `<div class="icon">${logicopIcon('convert')}</div>`;
    }
    const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function toolHref(tool) {
      const appType = (tool.config || {}).appType;
      if (appType === 'capacite_residuelle') return `../outils/capacite-residuelle.html?tool=${tool.id}`;
      if (appType === 'transport') return `../outils/transport.html?tool=${tool.id}`;
      if (appType === 'documents') return `../outils/documents.html?tool=${tool.id}`;
      if (appType === 'qrcode_blg') return `../outils/qrcode-blg.html?tool=${tool.id}`;
      if (appType === 'coefficient') return `../outils/simulation-coefficient.html?tool=${tool.id}`;
      if (appType === 'etiquettes_blg') return `../outils/etiquettes-blg.html?tool=${tool.id}`;
      if (appType === 'rapport_controle') return `../outils/rapport-controle.html?tool=${tool.id}`;
      if (appType === 'catalogue_produits') return `../outils/catalogue-produits.html?tool=${tool.id}`;
      if (appType === 'bibliotheque_prompts') return `../outils/bibliotheque-prompts.html?tool=${tool.id}`;
      return `../outils/executer-devis.html?tool=${tool.id}`;
    }

    // Ordre personnalisé + favoris, stockés localement par utilisateur
    const FAVS_KEY = 'logicop_favs_' + profile.id;
    const ORDER_KEY = 'logicop_order_' + profile.id;
    function loadFavs() {
      try { return new Set(JSON.parse(localStorage.getItem(FAVS_KEY) || '[]')); } catch { return new Set(); }
    }
    function saveFavs(favs) {
      localStorage.setItem(FAVS_KEY, JSON.stringify([...favs]));
    }
    function loadOrder() {
      try { return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]'); } catch { return []; }
    }
    function saveOrder(ids) {
      localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
    }
    const favs = loadFavs();

    let dragId = null;

    function renderTools() {
      grid.innerHTML = '';
      const orderList = loadOrder();
      const orderMap = {};
      orderList.forEach(function(id, i) { orderMap[id] = i; });
      const sorted = [...(tools || [])].sort(function(a, b) {
        const fa = favs.has(a.id) ? 0 : 1;
        const fb = favs.has(b.id) ? 0 : 1;
        if (fa !== fb) return fa - fb;
        const oa = orderMap[a.id] !== undefined ? orderMap[a.id] : 9999;
        const ob = orderMap[b.id] !== undefined ? orderMap[b.id] : 9999;
        if (oa !== ob) return oa - ob;
        return a.name.localeCompare(b.name);
      });
      sorted.forEach(function(tool, index) {
        const isFav = favs.has(tool.id);
        const a = document.createElement('a');
        a.className = 'card available';
        a.href = toolHref(tool);
        a.draggable = true;
        a.dataset.toolId = tool.id;
        a.style.animation = `riseIn .5s cubic-bezier(.2,.7,.2,1) ${Math.min(index, 12) * 45}ms backwards`;
        a.innerHTML = `
          <div class="card-top">
            ${toolIconHtml(tool)}
            <div class="card-actions">
              <span class="drag-handle" title="Maintenir et glisser pour réorganiser">${logicopIcon('grip')}</span>
              <button type="button" class="fav-btn${isFav ? ' active' : ''}" title="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}" aria-label="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}" aria-pressed="${isFav}">${logicopIcon('star')}</button>
            </div>
          </div>
          <h3>${esc(tool.name)}</h3>
          <p>${esc(tool.description || '')}</p>
          <span class="card-open">Ouvrir ${logicopIcon('arrow')}</span>
        `;
        a.querySelector('.fav-btn').addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (favs.has(tool.id)) favs.delete(tool.id); else favs.add(tool.id);
          saveFavs(favs);
          renderTools();
        });
        a.addEventListener('dragstart', function(e) {
          dragId = tool.id;
          a.style.opacity = '0.4';
          e.dataTransfer.effectAllowed = 'move';
        });
        a.addEventListener('dragend', function() {
          a.style.opacity = '';
          dragId = null;
          grid.querySelectorAll('.card').forEach(function(c) { c.classList.remove('drag-over'); });
        });
        a.addEventListener('dragover', function(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          a.classList.add('drag-over');
        });
        a.addEventListener('dragleave', function() {
          a.classList.remove('drag-over');
        });
        a.addEventListener('drop', function(e) {
          e.preventDefault();
          a.classList.remove('drag-over');
          if (!dragId || dragId === tool.id) return;
          var cards = Array.from(grid.querySelectorAll('.card[data-tool-id]'));
          var currentOrder = cards.map(function(c) { return c.dataset.toolId; });
          var fromIdx = currentOrder.indexOf(dragId);
          var toIdx = currentOrder.indexOf(tool.id);
          if (fromIdx < 0 || toIdx < 0) return;
          currentOrder.splice(fromIdx, 1);
          currentOrder.splice(toIdx, 0, dragId);
          saveOrder(currentOrder);
          renderTools();
        });
        grid.appendChild(a);
      });
    }
    renderTools();
  })();
</script>
</body>
</html>
