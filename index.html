<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logicop — Beauce Matériel</title>
<meta name="description" content="Logicop, l'espace outils de Beauce Matériel.">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body.home-page { background: #fff; }

  .home {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    align-items: center;
    gap: 24px;
    min-height: calc(100dvh - 80px);
    max-width: none;
    margin: 0;
    padding: 0 clamp(24px, 5vw, 88px);
    overflow: hidden;
  }
  /* Pan gris incliné, à droite, qui sort du cadre. */
  .home::before {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 46%;
    background: var(--paper);
    clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
    z-index: 0;
  }

  .home-copy { position: relative; z-index: 1; padding: 48px 0 64px; }

  .home-word {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(4.4rem, 9.4vw, 9.6rem);
    line-height: 0.82;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--bm-ink);
  }
  .home-word span { display: block; overflow: hidden; padding-top: 0.04em; }
  .home-word span > span { display: block; animation: wordUp 1s cubic-bezier(.16, 1, .3, 1) backwards; }
  @keyframes wordUp { from { transform: translateY(102%); } to { transform: translateY(0); } }

  /* La bande du logo BM : aplat rouge incliné posé sur une plaque grise. */
  .bm-band {
    position: relative;
    display: inline-block;
    margin: 18px 0 0 0.3em;
    transform: rotate(-2.5deg);
    transform-origin: left center;
    z-index: 1;
    animation: bandIn .7s cubic-bezier(.16, 1, .3, 1) .45s backwards;
  }
  .bm-band::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bm-gray);
    transform: translate(9px, 8px) rotate(1.6deg);
    z-index: -1;
  }
  .bm-band span {
    display: block;
    padding: 0.62em 1.15em 0.56em;
    background: var(--bm-red);
    color: #fff;
    font: 700 clamp(0.82rem, 1.25vw, 1.12rem)/1 var(--font-display);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  @keyframes bandIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .home-lead {
    margin: 44px 0 30px;
    max-width: 30ch;
    font: 600 clamp(1.25rem, 1.9vw, 1.7rem)/1.25 var(--font-display);
    color: var(--bm-ink);
    animation: riseIn .6s ease .7s backwards;
  }
  .home-lead small { display: block; margin-top: 8px; font: 400 1rem/1.5 var(--font-body); color: var(--text-dim); }

  /* Bouton principal : la même bande, cette fois cliquable. */
  .home-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    min-height: 64px;
    padding: 0 34px;
    color: #fff;
    font: 800 1rem/1 var(--font-display);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    transform: rotate(-1.5deg);
    transition: transform .25s cubic-bezier(.2, .7, .2, 1);
    animation: riseIn .6s ease .85s backwards;
  }
  .home-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bm-gray);
    transform: translate(8px, 8px) rotate(1.4deg);
    z-index: -1;
    transition: transform .25s cubic-bezier(.2, .7, .2, 1);
  }
  /* L'aplat rouge est une couche à part : peint après la plaque grise, avant le texte. */
  .home-cta::after { content: ''; position: absolute; inset: 0; background: var(--bm-red); z-index: -1; }
  .home-cta:hover { color: #fff; text-decoration: none; transform: rotate(-1.5deg) translate(-3px, -3px); }
  .home-cta:hover::before { transform: translate(13px, 13px) rotate(1.4deg); }
  .home-cta:active { transform: rotate(-1.5deg) translate(2px, 2px); }
  .home-cta:active::before { transform: translate(4px, 4px) rotate(1.4deg); }
  .home-cta:focus-visible { outline: 3px solid var(--bm-ink); outline-offset: 6px; }
  .home-cta svg { width: 22px; height: 22px; transition: transform .25s cubic-bezier(.2, .7, .2, 1); }
  .home-cta:hover svg { transform: translateX(6px); }
  .home-cta[aria-busy="true"] { visibility: hidden; }

  .home-note { margin: 30px 0 0; font-size: 0.9rem; color: var(--text-dim); animation: riseIn .6s ease 1s backwards; }
  .home-note strong { color: var(--bm-ink); font-weight: 600; }

  .home-visual { position: relative; z-index: 1; display: grid; place-items: center; }
  .home-visual img {
    width: min(100%, 470px);
    height: auto;
    filter: drop-shadow(18px 26px 0 rgba(42, 42, 42, 0.08));
    animation: cubeIn 1.1s cubic-bezier(.16, 1, .3, 1) .2s both, cubeFloat 7s ease-in-out 1.3s infinite;
  }
  @keyframes cubeIn { from { opacity: 0; transform: translateY(40px) rotate(-14deg) scale(.9); } to { opacity: 1; transform: translateY(0) rotate(-4deg); } }
  @keyframes cubeFloat { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(-2deg); } }

  @media (max-width: 900px) {
    .home { grid-template-columns: 1fr; gap: 0; align-items: start; padding: 0 22px; }
    .home::before { width: 100%; height: 300px; bottom: auto; clip-path: polygon(0 0, 100% 0, 100% 72%, 0 100%); }
    .home-visual { order: -1; padding-top: 28px; }
    .home-visual img { width: 190px; }
    .home-copy { padding: 36px 0 48px; }
    .home-word { font-size: clamp(3.4rem, 19vw, 6rem); }
    .home-lead { margin-top: 34px; }
    .home-cta { width: calc(100% - 10px); justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .home-word span > span, .bm-band, .home-visual img { animation: none; }
    .home-visual img { transform: rotate(-4deg); }
  }
</style>
</head>
<body class="home-page">
<a class="skip-link" href="#main">Aller au contenu</a>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="Logicop, accueil"><img class="brand-mark" src="assets/img/bm-cube.png" alt=""><span class="brand-text"><span class="brand-name">Logicop</span><span class="by-line">Beauce Matériel</span></span></a>
  <nav>
    <span id="navAccount"></span>
  </nav>
</header>

<main class="home" id="main">
  <section class="home-copy" aria-labelledby="homeTitle">
    <h1 class="home-word" id="homeTitle"><span><span>Logicop</span></span></h1>
    <p class="bm-band"><span>L'espace outils de Beauce Matériel</span></p>

    <p class="home-lead" id="homeLead">Vos outils, en un clic.
      <small id="homeLeadSub">Connectez-vous pour accéder aux outils qui vous ont été attribués.</small></p>

    <a class="home-cta" id="homeCta" href="pages/login.html">
      <span id="homeCtaLabel">Se connecter</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </a>
    <p class="home-note" id="homeNote">Pas encore de compte ? Il est créé par votre administrateur.</p>
  </section>

  <div class="home-visual" aria-hidden="true">
    <img src="assets/img/bm-cube-lg.png" alt="" width="619" height="666">
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  (async function () {
    const cta = document.getElementById('homeCta');
    cta.setAttribute('aria-busy', 'true');
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const profile = session ? await loadCurrentProfile() : null;
      if (profile) {
        // Connecté : le bouton principal devient le raccourci vers les outils.
        renderNavAccount('navAccount', 'pages/');
        cta.href = 'pages/' + (profile.is_admin ? 'admin.html' : 'dashboard.html');
        document.getElementById('homeCtaLabel').textContent = profile.is_admin ? 'Administration' : 'Mes outils';
        document.getElementById('homeLeadSub').textContent = 'Vous êtes connecté : retrouvez tous vos outils sur votre espace.';
        const note = document.getElementById('homeNote');
        note.textContent = 'Connecté avec ';
        const who = document.createElement('strong');
        who.textContent = profile.full_name || profile.email || '';
        note.appendChild(who);
      }
    } finally {
      cta.removeAttribute('aria-busy');
    }
  })();
</script>
</body>
</html>
